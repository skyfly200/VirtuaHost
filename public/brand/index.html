<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VirtuaHost logo concepts</title>
<style>
:root { --bg:#f5f6f8; --panel:#fff; --ink:#14181f; --muted:#5d6675; --accent:#5b3df5; --line:#dde1e8; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --panel:#181c25; --ink:#e8ebf1; --muted:#98a2b3; --accent:#8b78ff; --line:#2a303c; } }
body { margin:0; padding:24px 16px; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,sans-serif; }
h1 { font-size:20px; margin:0 0 4px; } p { color:var(--muted); margin:0 0 18px; max-width:60ch; }
.grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); max-width:1100px; }
.c { margin:0; padding:16px; background:var(--panel); border:1px solid var(--line); border-radius:14px; display:grid; gap:12px; }
.c svg { display:block; color:var(--ink); } .a { color:var(--accent); }
.c svg [fill="#5b3df5"] { fill:var(--accent); } .c svg [stroke="#5b3df5"] { stroke:var(--accent); }
.row2 { display:flex; align-items:flex-end; gap:16px; } .big svg { width:96px; } .mid svg { width:48px; } .small svg { width:24px; }
.word { display:flex; align-items:center; gap:10px; } .word svg { width:34px; } .word b { font-size:24px; letter-spacing:-.02em; }
figcaption { font-size:13px; color:var(--muted); } figcaption strong { color:var(--ink); }
</style></head><body>
<h1>VirtuaHost: logo concepts</h1>
<p>Five marks, each shown large, small (as a tab icon would be) and beside the wordmark. They follow the page's light and dark colours. The file for each is in this folder (<code>brand/&lt;name&gt;.svg</code>); the one in the app header is chosen in <code>public/shared/brand.js</code>.</p>
