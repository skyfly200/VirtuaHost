# Deploys the two web apps (no build step: plain files). NOT ACTIVE inside VirtuaHost, because Netlify only reads the repository root's
# netlify.toml. For a separate site, set Base directory to chips-voice/web and Publish directory to "." (see ../docs/HUB.md).
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
